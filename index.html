<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f2">
  <meta name="description" content="매일의 할 일을 기록하고 나만의 습관을 키워 보세요.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css?v=20261029-5">
  <title>나만의 루틴</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#today" aria-label="나만의 루틴 오늘 화면">
        <img src="icon.svg" alt="" width="36" height="36">
        <span>나만의 루틴</span>
      </a>
      <button class="icon-button" id="installButton" type="button" hidden aria-label="홈 화면에 설치" title="홈 화면에 설치">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
      </button>
    </header>

    <main id="appMain" tabindex="-1">
      <div class="loading-state" role="status">나만의 루틴을 준비하고 있어요…</div>
    </main>

    <nav class="bottom-nav" aria-label="주요 메뉴">
      <button data-view="today" class="nav-item active" type="button"><span class="nav-icon">☀</span><span>오늘</span></button>
      <button data-view="weekly" class="nav-item" type="button"><span class="nav-icon">▥</span><span>주간 분석</span></button>
      <button data-view="manage" class="nav-item" type="button"><span class="nav-icon">☷</span><span>관리</span></button>
      <button data-view="settings" class="nav-item" type="button"><span class="nav-icon">⚙</span><span>설정</span></button>
    </nav>
  </div>

  <dialog id="modal" class="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=20261029-5" defer></script>
</body>
</html>
